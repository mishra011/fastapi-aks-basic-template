apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmfastapi-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: fastapiacrdm.azurecr.io/dmfastapi-app:latest
        ports:
        - containerPort: 8000
        imagePullPolicy: Always
