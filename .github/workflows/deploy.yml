name: Deploy FastAPI to AKS

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_AKS_CLUSTER: ${{ vars.AZURE_AKS_CLUSTER }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}
  HELM_RELEASE: ${{ vars.HELM_RELEASE }}
  KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: deploy-fastapi-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check deployment configuration
        run: |
          for name in AZURE_RESOURCE_GROUP AZURE_AKS_CLUSTER ACR_NAME IMAGE_NAME HELM_RELEASE KUBE_NAMESPACE; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository variable: $name"
              exit 1
            fi
          done

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Validate chart
        run: helm lint ./infrastructure/helm/fastapi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: "v0.2.12"

      - name: Login to Azure Container Registry (ACR)
        run: |
          az acr login --name "$ACR_NAME"

      - name: Build Docker Image
        run: |
          docker build -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" .

      - name: Push Docker Image to ACR
        run: |
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

      - name: Set AKS Context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AZURE_AKS_CLUSTER }}
          admin: "false"
          use-kubelogin: "true"

      - name: Deploy FastAPI with Helm
        run: |
          helm upgrade --install "$HELM_RELEASE" ./infrastructure/helm/fastapi \
            --namespace "$KUBE_NAMESPACE" \
            --create-namespace \
            --set-string image.repository="$ACR_NAME.azurecr.io/$IMAGE_NAME" \
            --set-string image.tag="$IMAGE_TAG" \
            --wait --timeout 10m

      - name: Show deployment
        run: |
          helm status "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE"
          kubectl get pods,services --namespace "$KUBE_NAMESPACE"
