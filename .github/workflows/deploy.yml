name: Deploy FastAPI to AWS EKS
on:
  push:
    branches: [aws]
  pull_request:
    branches: [aws]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastapi-aws-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt httpx
      - name: Test application routes
        run: python -m unittest discover -s tests -v
      # This action only installs Helm; it does not authenticate to Azure.
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - run: helm lint infrastructure/helm/fastapi
      - run: helm template fastapi-app infrastructure/helm/fastapi --namespace fastapi > /tmp/fastapi.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.0'
      - run: terraform -chdir=infrastructure/terraform/aws fmt -check
      - run: terraform -chdir=infrastructure/terraform/aws init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/terraform/aws validate
      - name: Validate shell scripts
        run: |
          for script in scripts/*.sh setup_scripts/*.sh; do bash -n "$script"; done
      - name: Build container
        run: docker build --tag fastapi-validation .

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/aws' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
      HELM_RELEASE: ${{ vars.HELM_RELEASE }}
      # Unique on reruns as ECR tags are immutable.
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          for name in AWS_REGION EKS_CLUSTER_NAME ECR_REPOSITORY_URL KUBE_NAMESPACE HELM_RELEASE AWS_ROLE_ARN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub configuration: $name. Run setup_scripts/configure_github_aws.sh."
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - uses: docker/setup-buildx-action@v3
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - name: Install matching kubectl
        run: |
          version="$(aws eks describe-cluster --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME" --query cluster.version --output text)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/v${version}.0/bin/linux/amd64/kubectl"
          curl -fsSLo kubectl.sha256 "https://dl.k8s.io/release/v${version}.0/bin/linux/amd64/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
      - name: Build, push to ECR, deploy and check health
        run: ./scripts/deploy.sh
      - name: Deployment diagnostics
        if: failure()
        run: |
          export KUBECONFIG="$RUNNER_TEMP/eks-diagnostics"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl get pods,services --namespace "$KUBE_NAMESPACE"
          kubectl get events --namespace "$KUBE_NAMESPACE" --sort-by=.lastTimestamp
          helm status "$HELM_RELEASE" --namespace "$KUBE_NAMESPACE"
